<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<!-- AppIcon 的底稿。`app/make-icon.mjs` 把它按 1024×1024 渲染成 PNG，再拼成 .icns。
     ⚠️ 图标就是**那张 CEVTUO 卡片**（读者 2026-10-10：「图标就是那张 CEVTUO 卡片」）
        —— 不是重画的，是同一张 `src/ui/assets/card.png`，所以界面里外是同一个东西。
     ⚠️ macOS 的规矩：内容要留边（大约 10%），圆角约 22.4% —— 铺满整块会显得比别人的图标大一圈。 -->
<style>
  html,body{margin:0;width:1024px;height:1024px;background:transparent}
  .ic{position:absolute;left:104px;top:104px;width:816px;height:816px;border-radius:184px;
      background:linear-gradient(158deg,#2b2833 0%,#17181e 55%,#0c0d11 100%);
      display:grid;place-items:center;overflow:hidden;
      box-shadow:inset 0 2px 1px rgba(255,255,255,.10)}
  /* 一层很淡的高光，让这块底不至于像一张纯色贴纸 */
  .ic::after{content:'';position:absolute;inset:0;border-radius:184px;
      background:radial-gradient(120% 90% at 22% 8%,rgba(255,255,255,.10),transparent 60%)}
  .ic img{width:452px;height:auto;transform:rotate(-7deg);
      filter:drop-shadow(0 30px 46px rgba(0,0,0,.62));position:relative;z-index:1}
</style>
</head>
<body>
  <div class="ic"><img src="../src/ui/assets/card.png" alt=""></div>
</body>
</html>
